<style>
:root{--bg:#fff;--fg:#202122;--mut:#72777d;--link:#0645ad;--bd:#c8ccd1;--acc:#202122;--land:#f5f1e6;--sea:#dfe9f4;--font:system-ui,-apple-system,"Segoe UI",sans-serif;--hf:Georgia,serif;--w:820px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--font)}
a{color:var(--link);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}

<script>
const ADMIN="vadym.litvinov01@gmail.com";
const FIREBASE_CONFIG={apiKey:"",authDomain:"",projectId:"",appId:""}; // paste yours here
const BUILTIN={home:"Home",cases:"Cases",timeline:"Timeline",locations:"Locations (map)",about:"About"};
const DEF={title:"Newfoundland Murder Wiki",tagline:"A neutral, sourced archive of homicide cases in Newfoundland and Labrador, written with respect for victims and families.",notice:"A charge or arrest is an allegation, not a finding of guilt. Only court outcomes are stated as fact.",footer:"An independent archive of public records.",customcss:"",logo:"",banner:"",theme:{},home:{recent:1,years:1,locs:1,latest:1},
nav:[{l:"Home",t:"home"},{l:"Cases",t:"cases"},{l:"Timeline",t:"timeline"},{l:"Locations",t:"locations"},{l:"About",t:"about"}],
about:`## What this is
A non-commercial reference documenting homicide cases in Newfoundland and Labrador in a neutral tone.

## Area covered
The island of Newfoundland, Labrador and their communities.

## Sourcing
Court records, police releases and reputable news reporting. Every article lists references; unsourced claims are removed.

## Allegations and facts
Allegations and charges are labelled and attributed. Only court-confirmed matters are stated as fact. Everyone is presumed innocent unless convicted.

## Corrections
Send the article name and a source to the editor. Verified corrections are made promptly.

## Privacy
Only general locations are published. Minors, witnesses and unrelated private details are omitted. Families may request a review.

## Editorial policy
No speculation, no gratuitous detail, and dignity for victims and families.`};
const S=(id,name,year,month,place,region,status,lat,lon,summary)=>({id,name,year,month,place,region,status,lat,lon,summary,background:"Sample background, as reported by reliable sources.",investigation:"Sample police and court steps, attributed to their source.",legal:"A charge is an allegation, not a finding of guilt.",more:"",extra:"",images:[],refs:["Source one","Source two"]});
const SAMPLES=[S("case-a","Case A (sample)",2026,3,"St. John's","Avalon Peninsula","Charged",47.56,-52.71,"Placeholder text showing the article layout."),S("case-b","Case B (sample)",2026,1,"Corner Brook","West Coast","Under investigation",48.95,-57.95,"Placeholder for a case under investigation."),S("case-c","Case C (sample)",2025,11,"Gander","Central","Convicted",48.96,-54.61,"Placeholder for a concluded case.")];
const PLACES=[["St. John's","Avalon Peninsula",47.56,-52.71],["Mount Pearl","Avalon Peninsula",47.52,-52.81],["Paradise","Avalon Peninsula",47.53,-52.87],["Conception Bay South","Avalon Peninsula",47.5,-52.99],["Carbonear","Avalon Peninsula",47.74,-53.22],["Harbour Grace","Avalon Peninsula",47.7,-53.22],["Bay Roberts","Avalon Peninsula",47.6,-53.26],["Placentia","Avalon Peninsula",47.24,-53.97],["Marystown","Burin Peninsula",47.17,-55.15],["Clarenville","Eastern",48.16,-53.96],["Bonavista","Eastern",48.65,-53.11],["Gander","Central",48.96,-54.61],["Grand Falls-Windsor","Central",48.93,-55.65],["Lewisporte","Central",49.25,-55.07],["Twillingate","Central",49.65,-54.76],["Fogo","Central",49.72,-54.28],["Corner Brook","West Coast",48.95,-57.95],["Deer Lake","West Coast",49.17,-57.43],["Stephenville","West Coast",48.55,-58.58],["Channel-Port aux Basques","West Coast",47.57,-59.14],["St. Anthony","Northern Peninsula",51.36,-55.58],["Happy Valley-Goose Bay","Labrador",53.3,-60.33],["Labrador City","Labrador",52.94,-66.91],["Wabush","Labrador",52.9,-66.87],["Nain","Labrador",56.54,-61.69]];
// Simplified outlines (lon,lat). Decorative; pin positions use real coordinates.
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const live=!!FIREBASE_CONFIG.apiKey;
let CASES=[],DELETED=[],PAGES=[],SITE=structuredClone(DEF),db=null,user=null,localEdit=false,usingSamples=false,EDITING=null,NEWAT=null,CLONE=null,cur=location.hash||"#/";
const LS="nlmw2";
function persist(){if(live)return;try{localStorage.setItem(LS,JSON.stringify({cases:CASES.concat(DELETED),pages:PAGES,site:SITE}))}catch(e){$("#foot").textContent="Browser storage is full or blocked: changes won't survive closing this tab. Try smaller images."}}
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LS));if(v){const all=v.cases||[];CASES=all.filter(c=>!c.del);DELETED=all.filter(c=>c.del);PAGES=v.pages||[];SITE={...structuredClone(DEF),...v.site};return}}catch(e){}CASES=structuredClone(SAMPLES);DELETED=[]}
const canEdit=()=>live?(!!user&&(user.email||"").toLowerCase()===ADMIN&&user.emailVerified):localEdit;
const sorted=()=>[...CASES].sort((a,b)=>b.year-a.year||b.month-a.month);
const link=c=>`<a href="#/case/${c.id}">${esc(c.name)}</a>`;
const years=()=>[...new Set(CASES.map(c=>c.year))].sort((a,b)=>b-a);
const places=()=>[...new Set(CASES.map(c=>c.place))].sort();
const th=c=>c.images&&c.images[0]?`<img class="th" src="${esc(c.images[0].src)}" alt="">`:"";
const byYear=f=>years().map(y=>`<h2>${y}</h2><ul>${sorted().filter(c=>c.year==y).map(f).join("")}</ul>`).join("")||"<p class=mut>No cases yet.</p>";
const inl=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\[([^\]]+)\]\((#\/[^)\s]+)\)/g,'<a href="$2">$1</a>');
const fig=m=>`<figure class="fig"><img src="${esc(m.src)}" alt="${esc(m.cap)}">${m.cap?`<figcaption>${esc(m.cap)}</figcaption>`:""}</figure>`;
function rich(text,imgs=[],skip=0){const used=new Set(skip?[0]:[]);let h="",p=[],ul=[];
const fl=()=>{if(p.length)h+=`<p>${inl(p.join("<br>"))}</p>`;if(ul.length)h+=`<ul>${ul.map(x=>`<li>${inl(x)}</li>`).join("")}</ul>`;p=[];ul=[]};
for(const l of esc(text||"").split("\n")){if(l.startsWith("## ")){fl();h+=`<h2>${inl(l.slice(3))}</h2>`}else if(l.startsWith("- ")){if(p.length)fl();ul.push(l.slice(2))}else if(!l.trim())fl();else{if(ul.length)fl();p.push(l)}}fl();
h=h.replace(/\[img (\d+)\]/g,(a,n)=>{const m=imgs[n-1];if(!m)return"";used.add(n-1);return fig(m)});
const rest=imgs.map((m,i)=>used.has(i)?"":fig(m)).join("");return h+(rest?`<div class="gal">${rest}</div>`:"")}
const NOTE=()=>SITE.notice?`<p class="note">${esc(SITE.notice)}</p>`:"";
const EL=h=>canEdit()?`<p class="mut"><a href="${h}">[Edit this page]</a></p>`:"";
const GEN=()=>canEdit()?`<p class="mut">Generated from the articles. Edit an article to change it.</p>`:"";
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"page";
// ---------- map ----------
const SKEY=s=>{s=(s||"").toLowerCase();return s.includes("unsolved")||s.includes("investigat")?"unsolved":s.includes("charged")?"charged":s.includes("convict")?"convicted":s.includes("acquit")?"acquitted":"other"};
const SCOL={unsolved:"#c62828",charged:"#ef6c00",convicted:"#6a1b9a",acquitted:"#2e7d32",other:"#1565c0"};
const COL=s=>SCOL[SKEY(s)];
const LEG=`<p class="mut">Pin colour: <span class="dot" style="background:#c62828"></span>unsolved / investigating<span class="dot" style="background:#ef6c00"></span>charged<span class="dot" style="background:#6a1b9a"></span>convicted<span class="dot" style="background:#2e7d32"></span>acquitted<span class="dot" style="background:#1565c0"></span>other</p>`;
const mapHTML=()=>`<div class="mapbox"><div class="mb"><button type="button" data-v="island">Island</button> <button type="button" data-v="lab">Labrador</button> <button type="button" data-v="all">Whole province</button> <button type="button" data-z="in">+</button> <button type="button" data-z="out">−</button> <span class="mut" id="mapnote"></span></div><div class="mapholder"></div></div>`;
const LFB={island:[[46.45,-59.35],[51.78,-52.35]],lab:[[50.85,-68.6],[60.65,-54.75]],all:[[46.35,-68.6],[60.75,-52.25]]};
function mapInit(box,o){
const note=box.querySelector("#mapnote");
if(!window.L){box.querySelector(".mapholder").innerHTML='<p class="mut" style="padding:24px 12px">The map needs an internet connection to load. The lists below still work.</p>';return{mark(){}}}
note.textContent="Scroll to zoom, drag to move. Click a pin for details.";
const hold=box.querySelector(".mapholder");hold.innerHTML="<div class='map'></div>";
const NLB=[[44.5,-70.5],[62.5,-50.5]];
const map=L.map(hold.firstChild,{scrollWheelZoom:true,minZoom:5,maxBounds:NLB,maxBoundsViscosity:1,zoomControl:false});
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
map.fitBounds(LFB.island);
box.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>map.flyToBounds(LFB[b.dataset.v],{duration:.6}));
box.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>b.dataset.z=="in"?map.zoomIn():map.zoomOut());
L.control.scale({imperial:false}).addTo(map);
const ly=L.layerGroup().addTo(map);
const Ms=[];
(o.pins||[]).forEach(p=>{const c=p.c,m=L.circleMarker([p.lat,p.lon],{radius:9,color:"#fff",weight:1.5,fillColor:p.color,fillOpacity:.95}).addTo(ly);Ms.push({m,st:p.st,yr:p.yr});
m.bindPopup(`<div class="pp">${th(c)}<b><a href="#/case/${c.id}">${esc(c.name)}</a></b> <span class="bdg" style="background:${p.color}">${esc(c.status)}</span><br><span class="mut">${MON[c.month-1]} ${c.year} \u00b7 ${esc(c.place)}</span><br>${esc(c.summary)}</div>`);
m.on("mouseover",()=>m.setStyle({radius:12,weight:2.5})).on("mouseout",()=>m.setStyle({radius:9,weight:1.5}));
m.on("click",()=>o.onPin&&o.onPin(p))});
let mk=null;
const mark=(la,lo)=>{la=+la;lo=+lo;if(!isFinite(la)||!isFinite(lo))return;if(mk)mk.setLatLng([la,lo]);else mk=L.circleMarker([la,lo],{radius:13,color:"#e00",weight:2,fillColor:"#e00",fillOpacity:.15}).addTo(map)};
if(o.pick)map.on("click",e=>{if(e.originalEvent&&e.originalEvent.target&&e.originalEvent.target.closest&&e.originalEvent.target.closest(".leaflet-interactive"))return;mark(e.latlng.lat,e.latlng.lng);o.pick(e.latlng.lat,e.latlng.lng)});
if(o.marker&&o.marker.lat!=null)mark(o.marker.lat,o.marker.lon);
setTimeout(()=>map.invalidateSize(),60);
return{mark,filter:f=>Ms.forEach(x=>{const on=!f||f(x);if(on){if(!map.hasLayer(x.m))x.m.addTo(map)}else if(map.hasLayer(x.m))map.removeLayer(x.m)})}}
const pins=()=>CASES.filter(c=>isFinite(c.lat)&&isFinite(c.lon)&&c.lat!==null&&c.lon!==null).map(c=>({c,lat:+c.lat,lon:+c.lon,color:COL(c.status),st:SKEY(c.status),yr:c.year}));
// ---------- image / nav editors ----------
const shrink=(file,max=900)=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.75))};im.onerror=()=>r(null);im.src=fr.result};fr.readAsDataURL(file)});
function imgEd(box,arr,max=99){const draw=()=>{box.innerHTML=arr.map((m,i)=>`<div class="ie"><img src="${esc(m.src)}" alt=""><div><input data-c="${i}" value="${esc(m.cap)}" placeholder="Caption"> <button type="button" data-u="${i}">↑</button> <button type="button" data-r="${i}">Remove</button> <span class="mut">[img ${i+1}]</span></div></div>`).join("")+(arr.length<max?`<div class="mut">Add image: <input type="file" accept="image/*" multiple> or URL <input class="url" placeholder="https://…" size="20"> <button type="button" data-a="1">Add</button></div>`:"");
box.querySelectorAll("[data-c]").forEach(i=>i.oninput=()=>arr[i.dataset.c].cap=i.value);
box.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const i=+b.dataset.u;if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];draw()}});
box.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.r,1);draw()});
const fi=box.querySelector("input[type=file]");if(fi)fi.onchange=async()=>{for(const f of fi.files){const s=await shrink(f);if(s)arr.push({src:s,cap:""})}while(arr.length>max)arr.shift();draw()};
const ab=box.querySelector("[data-a]");if(ab)ab.onclick=()=>{const u=box.querySelector(".url").value.trim();if(u){arr.push({src:u,cap:""});while(arr.length>max)arr.shift();draw()}}};draw()}
function navEd(box,arr){const opts=n=>[...Object.entries(BUILTIN),...PAGES.map(p=>["page:"+p.id,"Page: "+p.title]),...(n.t=="__new"?[["__new","(new blank page)"]]:[])];
const draw=()=>{box.innerHTML=arr.map((n,i)=>`<div class="ne"><input data-l="${i}" value="${esc(n.l)}"> <select data-t="${i}">${opts(n).map(([k,v])=>`<option value="${esc(k)}" ${n.t==k?"selected":""}>${esc(v)}</option>`).join("")}</select> <button type="button" data-u="${i}">↑</button><button type="button" data-d="${i}">↓</button><button type="button" data-x="${i}">Remove</button></div>`).join("")+`<button type="button" data-add="1">+ Add tab</button>`;
box.querySelectorAll("[data-l]").forEach(i=>i.oninput=()=>arr[i.dataset.l].l=i.value);box.querySelectorAll("[data-t]").forEach(i=>i.onchange=()=>arr[i.dataset.t].t=i.value);
box.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const i=+b.dataset.u;if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];draw()}});
box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const i=+b.dataset.d;if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];draw()}});
box.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.x,1);draw()});
box.querySelector("[data-add]").onclick=()=>{arr.push({l:"New tab",t:"__new"});draw()}};draw()}
let DRAFT=[],DNAV=[],DLOGO=[],DBAN=[];
// ---------- pages ----------
const R={
home(){const H=SITE.home||{};return`<h1>${esc(SITE.title)}</h1>${EL("#/admin")}${SITE.banner?`<img class="banner" src="${esc(SITE.banner)}" alt="">`:""}${rich(SITE.tagline)}<p class="mut">${CASES.length} articles.</p>${NOTE()}
${(()=>{const F=CASES.filter(c=>c.feat);return F.length?`<h2>Featured cases</h2><ul>${F.map(c=>`<li>${th(c)}${link(c)} <span class="mut">${MON[c.month-1]} ${c.year}, ${esc(c.place)}</span></li>`).join("")}</ul>`:""})()}
${H.recent?`<h2>Recent cases</h2><ul>${sorted().slice(0,5).map(c=>`<li>${th(c)}${link(c)} <span class="mut">${MON[c.month-1]} ${c.year}, ${esc(c.place)}</span></li>`).join("")}</ul>`:""}
${H.years?`<h2>Browse by year</h2><p>${years().map(y=>`<a href="#/cases">${y}</a>`).join(" · ")}</p>`:""}

const rbb=$("#rbb");app.querySelectorAll("[data-rst]").forEach(b=>b.onclick=async()=>{const c=DELETED.find(x=>x.id==b.dataset.rst);if(!c)return;const r={...c};delete r.id;delete r.del;delete r.delAt;try{await write("cases",c.id,r);route()}catch(x){b.textContent="Failed"}});
app.querySelectorAll("[data-prg]").forEach(b=>b.onclick=async()=>{await purge(b.dataset.prg);route()});
if(rbb)rbb.onchange=async()=>{const f2=rbb.files[0];if(!f2)return;try{const d=JSON.parse(await f2.text());if(!Array.isArray(d.cases))throw new Error("not a valid backup file");
if(live){const b2=db.batch();d.cases.forEach(c=>{const{id,...r}=c;b2.set(db.collection("cases").doc(id),r)});const snap=await db.collection("cases").get();snap.forEach(doc=>{if(!d.cases.some(c=>c.id===doc.id))b2.delete(doc.ref)});await b2.commit();
 if(d.site)await db.collection("site").doc("main").set(d.site);
 const ps=await db.collection("pages").get();const pb=db.batch();ps.forEach(doc=>pb.delete(doc.ref));(d.pages||[]).forEach(p=>{const{id,...r}=p;pb.set(db.collection("pages").doc(id),r)});await pb.commit()}
else{CASES=d.cases.filter(c=>!c.del);DELETED=d.cases.filter(c=>c.del);PAGES=d.pages||[];SITE={...structuredClone(DEF),...d.site};persist()}
$("#bmsg").textContent="Restore complete.";setTimeout(()=>go("#/"),700)}catch(x){$("#bmsg").textContent="Restore failed: "+x.message}};}
bind($("#sf"),()=>go("#/search/"+encodeURIComponent($("#q").value)));
addEventListener("hashchange",()=>{if(location.hash&&location.hash!==cur){cur=location.hash;route()}});
if(live){CASES=structuredClone(SAMPLES);usingSamples=true;firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
firebase.auth().onAuthStateChanged(u=>{user=u;route()});
db.collection("cases").onSnapshot(s=>{usingSamples=s.empty;const all=s.empty?structuredClone(SAMPLES):s.docs.map(d=>({id:d.id,...d.data()}));CASES=all.filter(c=>!c.del);DELETED=all.filter(c=>c.del);if(!/edit/.test(cur))route()},()=>{});
db.collection("pages").onSnapshot(s=>{PAGES=s.docs.map(d=>({id:d.id,...d.data()}));if(!/edit|admin/.test(cur))route()},()=>{});
db.collection("site").doc("main").onSnapshot(d=>{SITE={...structuredClone(DEF),...(d.data()||{})};if(!/edit|admin/.test(cur))route()},()=>{})}
else loadLocal();
route();
</script></body></html>
